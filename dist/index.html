<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>美国-伊朗局势日报</title>
  <style>
    :root {
      --bg: #f4efe5;
      --panel: rgba(255, 252, 245, 0.9);
      --ink: #182028;
      --muted: #5f6a72;
      --accent: #b33a1b;
      --accent-2: #115e59;
      --border: rgba(24, 32, 40, 0.12);
      --shadow: 0 20px 50px rgba(24, 32, 40, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(179, 58, 27, 0.12), transparent 28%),
        radial-gradient(circle at bottom right, rgba(17, 94, 89, 0.16), transparent 32%),
        linear-gradient(180deg, #efe6d6 0%, var(--bg) 48%, #f7f2ea 100%);
      min-height: 100vh;
    }

    .wrap {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 36px 0 56px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    .hero-card, .meta-card, .group, .source-card, .analysis-card, .analysis-side {
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }

    .hero-card {
      padding: 28px;
      border-radius: 28px;
    }

    .meta-card {
      padding: 24px;
      border-radius: 24px;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      margin: 10px 0 14px;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 0.96;
      max-width: 10ch;
    }

    .lead {
      margin: 0;
      font-size: 18px;
      line-height: 1.7;
      color: var(--muted);
      max-width: 58ch;
    }

    .meta-line {
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(24, 32, 40, 0.04);
    }

    .meta-line strong {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
      color: var(--muted);
    }

    .group {
      border-radius: 30px;
      padding: 24px;
      margin-bottom: 22px;
    }

    .analysis {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
      margin-bottom: 26px;
    }

    .analysis-card, .analysis-side {
      border-radius: 26px;
      padding: 24px;
    }

    .analysis-card h2, .analysis-side h3 {
      margin: 0 0 12px;
    }

    .brief-block + .brief-block {
      margin-top: 18px;
    }

    .brief-title {
      margin: 0 0 10px;
      font-size: 16px;
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 6px 12px;
      color: white;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .analysis-overview {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .analysis-list {
      list-style: disc;
      padding-left: 20px;
      margin: 0;
      color: var(--ink);
      display: grid;
      gap: 10px;
    }

    .analysis-list li {
      border: 0;
      padding: 0;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .theme-box {
      padding: 14px;
      border-radius: 18px;
      background: rgba(24, 32, 40, 0.05);
    }

    .theme-box strong {
      display: block;
      font-size: 24px;
      margin-bottom: 6px;
    }

    .headlines {
      display: grid;
      gap: 10px;
    }

    .headline-link {
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      line-height: 1.5;
    }

    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 18px;
    }

    .group h2 {
      margin: 0;
      font-size: 28px;
    }

    .group small {
      color: var(--muted);
    }

    .sources {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .source-card {
      border-radius: 22px;
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .source-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .source-top a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      font-size: 19px;
    }

    .badge {
      font-size: 12px;
      color: white;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--accent-2);
      white-space: nowrap;
    }

    .badge.error {
      background: var(--accent);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    li {
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    li:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .item-link {
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      line-height: 1.45;
    }

    .summary {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .time {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .error-text {
      color: var(--accent);
      font-size: 14px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 860px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .analysis {
        grid-template-columns: 1fr;
      }

      .wrap {
        width: min(100vw - 18px, 1180px);
        padding-top: 18px;
      }

      .group {
        padding: 18px;
      }
    }
  </style>
</head>
